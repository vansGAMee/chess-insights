name: MQ-Chess Update (Loss Index)
on:
  workflow_dispatch:

jobs:
  compute-mq:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Python deps
        run: pip install -r analyzer/requirements.txt
      - name: Build C++ module
        run: cd analyzer && python setup.py build_ext --inplace && cd ..
      - name: Run MQ computation
        run: python analyzer/compute_mq.py
      - name: Commit updated stats
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add docs/stats.json cache/analyzed.json
          git diff --staged --quiet || (git commit -m "🔥 MQ-Chess stats update" && git push)